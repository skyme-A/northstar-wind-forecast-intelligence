services:
  - type: web
    name: wind-forecast-intelligence-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: CORS_ORIGINS
        value: http://localhost:5173,http://127.0.0.1:5173,https://northstar-wind-forecast-intelligenc.vercel.app
